<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% if first_name %}Add {{ first_name }} on SpendIt{% else %}SpendIt{% endif %}</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f7f5; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --accent: #1a7f5a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111; --card: #1c1c1e; --text: #f5f5f7; --muted: #a1a1a6; --accent: #34c38f; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
           color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(420px, calc(100% - 32px)); background: var(--card); border-radius: 20px;
           padding: 32px 24px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    a.button { display: block; padding: 14px; border-radius: 12px; text-decoration: none;
               font-weight: 600; margin-top: 12px; }
    a.primary { background: var(--accent); color: #fff; }
    a.secondary { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    {% if first_name %}
      <h1>Add {{ first_name }} on SpendIt</h1>
      <p>Split bills with {{ first_name }} and settle up in a tap.</p>
      <a class="button primary" href="{{ app_store_url }}">Get SpendIt</a>
      <a class="button secondary" href="{{ open_url }}">Already have it? Open in SpendIt</a>
    {% else %}
      <h1>This code isn't valid anymore</h1>
      <p>Ask your friend to show you their SpendIt code again.</p>
      <a class="button primary" href="{{ app_store_url }}">Get SpendIt</a>
    {% endif %}
  </main>
</body>
</html>
